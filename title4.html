<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Wall Of Fame</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Poppins:wght@300&display=swap" rel="stylesheet">

<style>
/* =================================
   BASE
================================= */
body{
    margin:0;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    overflow:hidden;

    font-family:"Fredoka", sans-serif;
    background: linear-gradient(135deg,#1b5e20,#2e7d32,#ef6c00);
    color:white;
}

/* =================================
   ISLAMIC GEOMETRIC PATTERN
================================= */
body::before{
    content:"";
    position:absolute;
    inset:0;
    opacity:.12;
    background:
        repeating-linear-gradient(45deg, white 0 2px, transparent 2px 40px),
        repeating-linear-gradient(-45deg, white 0 2px, transparent 2px 40px);
    pointer-events:none;
}

/* =================================
   TROPHY ICON
================================= */
.trophy{
    font-size: clamp(2.5rem,5vw,3.5rem);
    margin-bottom:10px;
    animation:pop 1.2s ease infinite alternate;
}

@keyframes pop{
    from{ transform:translateY(0); }
    to{ transform:translateY(-8px); }
}

/* =================================
   TITLE
================================= */
.wave-text{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    justify-content:center;
    font-weight:600;
    z-index:2;
}

.wave-text span{
    opacity:0;
    font-size: clamp(2.5rem,9vw,5rem);
    transform:translateY(15px);
}

.show{
    animation:
        fadeIn .4s forwards,
        bounce 1.8s ease-in-out infinite .4s;
}

@keyframes fadeIn{
    to{ opacity:1; transform:translateY(0); }
}

@keyframes bounce{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-16px); }
}

/* AIS color theme */
.wave-text span:nth-child(odd){ color:#fff; }
.wave-text span:nth-child(even){ color:#ffb74d; }
.green{ color:#c8ffb0 !important; }

/* =================================
   SUBTITLE
================================= */
.subtitle{
    margin-top:25px;
    font-family:"Poppins", sans-serif;
    letter-spacing:2px;
}

/* =================================
   SPARKLES
================================= */
.sparkle{
    position:absolute;
    width:6px;
    height:6px;
    background:white;
    border-radius:50%;
    opacity:0;
    animation:twinkle 2.5s infinite;
}

@keyframes twinkle{
    0%,100%{opacity:0; transform:scale(.5);}
    50%{opacity:1; transform:scale(1.4);}
}

/* =================================
   CONFETTI
================================= */
.confetti{
    position:absolute;
    width:8px;
    height:12px;
    animation:fall 2.5s linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(720deg);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="trophy">🏆</div>
<h1 id="title" class="wave-text"></h1>
<div class="subtitle">by Shereen & Mr. Amhar</div>

<script>
/* =================================
   AUTO TYPING
================================= */
const text = "Wall Of Fame";
const title = document.getElementById("title");

text.split("").forEach((ch,i)=>{
    const span=document.createElement("span");
    span.innerHTML = ch===" " ? "&nbsp;" : ch;

    if(["W","O","F"].includes(ch)) span.classList.add("green");

    title.appendChild(span);

    setTimeout(()=>{
        span.classList.add("show");
    }, i*120);
});

/* =================================
   DING SOUND (WebAudio)
================================= */
function ding(){
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();

    osc.type="triangle";
    osc.frequency.value=880;

    gain.gain.value=.15;

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();
    osc.stop(ctx.currentTime+.25);
}

/* play ding after typing */
setTimeout(ding, text.length*120 + 200);


/* =================================
   SPARKLES
================================= */
for(let i=0;i<25;i++){
    const s=document.createElement("div");
    s.className="sparkle";
    s.style.left=Math.random()*100+"vw";
    s.style.top=Math.random()*100+"vh";
    s.style.animationDelay=Math.random()*3+"s";
    document.body.appendChild(s);
}

/* =================================
   CONFETTI BURST ON LOAD
================================= */
const colors=["#fff","#ffb74d","#c8ffb0"];

for(let i=0;i<120;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.top="-20px";
    c.style.background=colors[Math.floor(Math.random()*3)];
    c.style.animationDelay=Math.random()*0.5+"s";
    document.body.appendChild(c);
}
</script>

</body>
</html>
